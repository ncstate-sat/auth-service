apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: satregistry.ehps.ncsu.edu/auth-service/auth-service:main
          imagePullPolicy: IfNotPresent
          env:
            - name: http_proxy
              value: http://proxy.oit.ncsu.edu:3128
            - name: https_proxy
              value: http://proxy.oit.ncsu.edu:3128
            - name: GOOGLE_CLIENT_ID
              value: "1234-567890.apps.googleusercontent.com"
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: MONGODB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_SECRET
            - name: ROOT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: ROOT_ADMIN_EMAIL
