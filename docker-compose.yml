services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .envrc
    environment:
      MONGODB_URL: mongodb://mongo:27017/
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: auth_service
      # MongoDB 8+ won't start on Linux kernel 6.19+ with the image's default
      # (glibc.pthread.rseq=0); see https://jira.mongodb.org/browse/SERVER-121912.
      # Remove once a MongoDB release ships a fixed TCMalloc.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
